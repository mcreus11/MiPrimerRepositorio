# H2 + JPA
spring.datasource.url=jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# Mostrar SQL y crear tablas automáticamente
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create

# Diferir la carga de data.sql hasta que Hibernate haya creado las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=change-this-super-secret-key-please-32bytes-min
app.jwt.expiration-seconds=3600

# Logging
logging.level.org.springframework.security=INFO
